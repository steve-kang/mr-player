<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광고 시험 페이지</title>
<style>
  body { margin: 0; padding: 12px; background: #0f1117; color: #e8eaf0; font-family: -apple-system, "Noto Sans KR", sans-serif; }
  .box { width: 100%; aspect-ratio: 16 / 9; background: #000; }
  input { width: 100%; box-sizing: border-box; min-height: 44px; margin: 4px 0 8px; padding: 0 10px; font-size: 15px; }
  button { min-height: 52px; width: 100%; margin: 4px 0; font-size: 16px; font-weight: 700; border: 0; border-radius: 10px; background: #3ddc97; color: #0b1a12; }
  label { display: block; margin: 8px 0; font-size: 15px; }
  pre { white-space: pre-wrap; font-size: 12px; color: #9aa0b0; }
  h1 { font-size: 16px; color: #9aa0b0; }
</style>
</head>
<body>
<h1>광고 시험 페이지 (Lovable 앱과 같은 방식)</h1>
<div class="box"><div id="player"></div></div>

<label>영상 1 주소 <input id="u1" type="url" value="https://www.youtube.com/watch?v=Nl4SyK_kOE8" placeholder="https://www.youtube.com/watch?v=..."></label>
<label>영상 2 주소 <input id="u2" type="url" value="https://www.youtube.com/watch?v=ahjZWOfCs5w" placeholder="https://www.youtube.com/watch?v=..."></label>
<label>시작 초 (두 영상 공통) <input id="st" type="number" value="30"></label>
<label>끝 초 (두 영상 공통) <input id="en" type="number" value="90"></label>
<button id="auto" type="button" style="background:#ffd866">자동 시험 시작 (약 6분, 화면을 켠 채로 두세요)</button>
<div id="summary" style="margin:10px 0;font-size:14px;line-height:1.7"></div>
<div id="opts" style="margin:10px 0;padding:10px;border:1px solid #2a2f3d;border-radius:10px">
  <div style="font-size:13px;color:#9aa0b0;margin-bottom:6px">스위치 (처음에는 모두 꺼 두세요. 하나씩 켜면서 시험합니다)</div>
  <label><input type="checkbox" id="o-end" style="width:auto;min-height:0;margin:0 8px 0 0"> 끝 시각을 YouTube에 전달 (endSeconds)</label>
  <label><input type="checkbox" id="o-poll" style="width:auto;min-height:0;margin:0 8px 0 0"> 0.15초마다 재생 위치 읽기</label>
  <label><input type="checkbox" id="o-vol" style="width:auto;min-height:0;margin:0 8px 0 0"> 볼륨 100 설정</label>
  <label><input type="checkbox" id="o-rate" style="width:auto;min-height:0;margin:0 8px 0 0"> 재생 속도 1 설정</label>
</div>
<button id="b1" type="button">영상 1 재생</button>
<button id="b2" type="button">영상 2 재생</button>
<pre id="log"></pre>

<script>
(function () {
  var player = null, ready = false, pending = null;
  function $(id) { return document.getElementById(id); }
  function log(m) { var d = new Date(); $('log').textContent = d.toLocaleTimeString() + ' ' + m + '\n' + $('log').textContent; }
  function vid(u) {
    var m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function play(n) {
    var id = vid($('u' + n).value);
    if (!id) { log('영상 ' + n + ' 주소를 확인하세요.'); return; }
    var opts = { videoId: id, startSeconds: Number($('st').value) || 0 };
    var end = Number($('en').value);
    if ($('o-end').checked && end > opts.startSeconds) opts.endSeconds = end;
    if (!ready) { pending = opts; log('플레이어 준비 중...'); return; }
    log('loadVideoById ' + JSON.stringify(opts));
    player.loadVideoById(opts);
    if ($('o-rate').checked) player.setPlaybackRate(1);
    if ($('o-vol').checked) player.setVolume(100);
  }
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      width: '100%', height: '100%',
      playerVars: { playsinline: 1, controls: 1, rel: 0 },
      events: {
        onReady: function () { ready = true; log('준비됨'); if (pending) { var o = pending; pending = null; player.loadVideoById(o); } },
        onStateChange: function (e) {
          log('상태 ' + e.data);
          if (e.data === 1) {
            if ($('o-rate').checked && player.getPlaybackRate() !== 1) player.setPlaybackRate(1);
            if ($('o-vol').checked) player.setVolume(100);
          }
        },
        onError: function (e) { log('오류 ' + e.data); }
      }
    });
  };
  var pollTimer = null;
  function setPoll(on) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (on) {
      pollTimer = setInterval(function () {
        if (!ready) return;
        player.getCurrentTime(); player.getPlayerState(); player.getDuration();
      }, 150);
    }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // Watches ~10s after a load. Ad suspected if the playhead sits far before the start point.
  async function watch(start) {
    var adSamples = 0, raw = [];
    for (var i = 0; i < 20; i++) {
      await sleep(500);
      var st = player.getPlayerState(), ct = player.getCurrentTime() || 0;
      raw.push(Math.round(ct));
      if (i >= 3 && (st === 1 || st === 3 || st === -1) && ct < start - 3) adSamples++;
    }
    return { ad: adSamples >= 2, raw: raw.join(',') };
  }

  var running = false;
  async function autoTest() {
    if (running) return;
    if (!vid($('u1').value) || !vid($('u2').value)) { log('영상 1, 2 주소를 먼저 넣으세요.'); return; }
    if (!ready) { log('플레이어가 아직 준비되지 않았습니다. 잠시 후 다시 누르세요.'); return; }
    running = true;
    $('auto').disabled = true;
    var start = Number($('st').value) || 0;
    var configs = [
      ['모두 끔', {}], ['끝 시각 전달', { end: 1 }], ['위치 읽기', { poll: 1 }],
      ['볼륨 설정', { vol: 1 }], ['속도 설정', { rate: 1 }], ['모두 켬', { end: 1, poll: 1, vol: 1, rate: 1 }]
    ];
    var rows = [];
    var N = 5;
    for (var c = 0; c < configs.length; c++) {
      var cfg = configs[c][1];
      $('o-end').checked = !!cfg.end; $('o-vol').checked = !!cfg.vol; $('o-rate').checked = !!cfg.rate; $('o-poll').checked = !!cfg.poll;
      setPoll(!!cfg.poll);
      var ads = 0, raws = [];
      for (var i = 0; i < N; i++) {
        $('summary').innerHTML = rows.join('<br>') + '<br>시험 중: ' + configs[c][0] + ' (' + (i + 1) + '/' + N + ')';
        play(i % 2 + 1);
        var r = await watch(start);
        if (r.ad) ads++;
        raws.push('[' + r.raw + ']');
      }
      rows.push('<b>' + configs[c][0] + '</b>: 광고 의심 ' + ads + '/' + N + '회');
      log(configs[c][0] + ' 측정값(초): ' + raws.join(' '));
    }
    setPoll(false);
    player.pauseVideo();
    $('summary').innerHTML = rows.join('<br>') + '<br>끝났습니다. 위 표를 캡처해서 보내 주세요.';
    $('auto').disabled = false;
    running = false;
  }
  $('auto').addEventListener('click', autoTest);

  $('o-poll').addEventListener('change', function () { setPoll(this.checked); });
  $('b1').addEventListener('click', function () { play(1); });
  $('b2').addEventListener('click', function () { play(2); });
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>
</body>
</html>
